version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: chat_application_db
    restart: always
    environment:
      POSTGRES_DB: chat_application
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Srini123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chat-network

volumes:
  postgres_data:

networks:
  chat-network:
    driver: bridge
